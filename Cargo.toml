[package]
name = "deem"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Judge logs, tickets and screenshots by what they mean, from the shell."
license = "MIT"
repository = "https://github.com/phyro/deem"
readme = "README.md"
keywords = ["jq", "grep", "llm", "cli", "classification"]
categories = ["command-line-utilities", "text-processing"]
# The crate is what builds and tests deem (tests/readme.rs reads the skill in
# .claude/); the demo gifs, CI and the agents' notes stay in the repo.
exclude = ["/docs/demo/", "/.github/", "/AGENTS.md", "/CLAUDE.md", "/justfile", "/rustfmt.toml"]

[dependencies]
jaq-core = "=3.1.2"
jaq-json = "=2.0.3"
jaq-std = "=3.0.4"
lexopt = "0.3"
regex-lite = "0.1"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
ureq = { version = "3", default-features = false, features = ["rustls", "multipart"] }
wild = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
# Records fail by unwinding (`RecordFailed`), caught at the record's thread.
panic = "unwind"
